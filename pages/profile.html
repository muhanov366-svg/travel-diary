<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        img-src * data: blob: 'unsafe-inline' https: http:;
        script-src 'self' 'unsafe-inline' 'unsafe-eval';
        style-src 'self' 'unsafe-inline';
        connect-src * https: http: ws: wss:;
        font-src * data:;
        media-src *;
        frame-src *;
    ">
    <title>Профиль — Дневник путешествий</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <div class="container header-flex">
            <h1>🌍 Дневник путешествий</h1>
            <nav>
                <a href="../index.html">Главная</a>
                <a href="create.html">➕ Создать</a>
                <a href="profile.html" class="active">👤 Профиль</a>
                <span id="userDisplay" class="user-name"></span>
                <button id="logoutBtn" class="btn-logout">Выйти</button>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="profile-header">
                <div class="profile-avatar">👤</div>
                <div class="profile-info">
                    <h3 id="profileName">Загрузка...</h3>
                    <p id="profileEmail">Загрузка...</p>
                </div>
            </div>
            
            <h2>✈️ Мои путешествия</h2>
            <div id="userTravels">
                <p class="loading">⏳ Загрузка...</p>
            </div>
        </div>
    </main>

    <script src="../app.js"></script>
    <script>
        if (typeof isLoggedIn === 'function' && !isLoggedIn()) {
            window.location.href = 'login.html';
        }
        
        function loadUserProfile() {
            if (typeof getCurrentUser !== 'function') return;
            var user = getCurrentUser();
            if (user) {
                document.getElementById('profileName').textContent = user.name;
                document.getElementById('profileEmail').textContent = '📧 ' + user.email;
            }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            loadUserProfile();
            if (typeof loadUserTravels === 'function') {
                loadUserTravels();
            }
            if (typeof updateUserInfo === 'function') {
                updateUserInfo();
            }
        });
    </script>
</body>
</html>
